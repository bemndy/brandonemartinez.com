name: CI

on:
  push:
    branches:
      - 'main'
      - 'feature/*'
      - 'bugfix/*'
  pull_request:
    branches: 
      - 'feature/*'
      - 'bugfix/*'  

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 24, 26, 27]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
