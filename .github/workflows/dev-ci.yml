name: dev-ci

# Every push to a feature or bugfix branch.
# Note the '**': a single '*' does not match '/', so 'feature/*' would skip
# nested names like feature/claude/add-404-page.
on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test --if-present
