name: dev-ci

on:
  push:
    # Only run on bugfix branches, every push
    branches:
      - 'bugfix/*'
  pull_request:
    branches: 
      - 'feature/*'
      - 'bugfix/*'  

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 24, 26, 27]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test --if-present
