name: prod-ci

# Every pull request targeting main. ('branches' filters the PR's *target*
# branch, not the source, so this covers PRs from any feature/bugfix branch.)
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24, 26]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # TODO: integration tests (playwright) run here only, not in dev-ci.
      - run: npm test --if-present
